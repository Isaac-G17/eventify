<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Evento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center px-6">

<div class="bg-white rounded-2xl shadow-md w-full max-w-md p-8">
    <h1 class="text-xl font-semibold mb-6"
        th:text="${event.id == null} ? 'Registrar nuevo evento' : 'Editar evento'">
        Registrar nuevo evento
    </h1>

    <form th:action="${event.id == null} ? @{/admin/eventos} : @{/admin/eventos/{id}(id=${event.id})}"
          th:object="${event}" method="post" class="space-y-4">

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Nombre</label>
            <input type="text" th:field="*{nombre}"
                   class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-950 transition-all duration-300"/>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Fecha</label>
            <input type="date" th:field="*{fecha}"
                   class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-950 transition-all duration-300"/>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Descripción</label>
            <textarea th:field="*{descripcion}" rows="3"
                      class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-950 transition-all duration-300"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
            <a th:href="@{/admin/eventos}"
               class="px-5 py-2.5 rounded-2xl bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition-all duration-300">
                Cancelar
            </a>
            <button type="submit"
                    class="px-5 py-2.5 rounded-2xl bg-blue-950 text-white font-medium shadow-sm hover:bg-blue-900 transition-all duration-300">
                Guardar
            </button>
        </div>
    </form>
</div>

</body>
</html>
