<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">

<header class="bg-blue-950 text-white">
    <div class="max-w-6xl mx-auto px-6 py-8 flex items-center justify-between flex-wrap gap-4">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Panel de Eventos</h1>
            <p class="mt-1 text-blue-200 text-sm">Administra el catálogo de eventos.</p>
        </div>
        <nav class="flex gap-3">
            <a th:href="@{/}"
               class="px-4 py-2 rounded-2xl bg-blue-900 text-blue-100 text-sm font-medium hover:bg-blue-800 transition-all duration-300">
                Inicio
            </a>
            <a th:href="@{/admin/venues}"
               class="px-4 py-2 rounded-2xl bg-blue-900 text-blue-100 text-sm font-medium hover:bg-blue-800 transition-all duration-300">
                Panel de lugares
            </a>
        </nav>
    </div>
</header>

<section class="max-w-6xl mx-auto px-6 py-12">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-semibold">Eventos registrados</h2>
        <a th:href="@{/admin/eventos/nuevo}"
           class="px-5 py-2.5 rounded-2xl bg-blue-950 text-white font-medium shadow-sm hover:bg-blue-900 transition-all duration-300">
            + Registrar nuevo evento
        </a>
    </div>

    <div th:if="${eventos.isEmpty()}" class="text-slate-500">
        Actualmente no hay eventos programados.
    </div>

    <div th:unless="${eventos.isEmpty()}" class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-blue-950 text-blue-100 text-sm uppercase tracking-wide">
            <tr>
                <th class="px-6 py-3">ID</th>
                <th class="px-6 py-3">Nombre</th>
                <th class="px-6 py-3">Fecha</th>
                <th class="px-6 py-3">Descripción</th>
                <th class="px-6 py-3">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="evento : ${eventos}"
                class="border-t border-slate-100 hover:bg-blue-50 transition-all duration-300">
                <td class="px-6 py-4 text-slate-400" th:text="${evento.id}"></td>
                <td class="px-6 py-4 font-medium" th:text="${evento.nombre}"></td>
                <td class="px-6 py-4 text-slate-500" th:text="${evento.fecha}"></td>
                <td class="px-6 py-4 text-slate-500" th:text="${evento.descripcion}"></td>
                <td class="px-6 py-4">
                    <div class="flex gap-2">
                        <a th:href="@{/admin/eventos/{id}/editar(id=${evento.id})}"
                           class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-medium hover:bg-slate-200 transition-all duration-300">
                            Editar
                        </a>
                        <form th:action="@{/admin/eventos/{id}/eliminar(id=${evento.id})}" method="post"
                              onsubmit="return confirm('¿Seguro que deseas eliminar este evento?')">
                            <button type="submit"
                                    class="px-3 py-1.5 rounded-xl bg-red-50 text-red-600 text-sm font-medium hover:bg-red-100 transition-all duration-300">
                                Eliminar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${eventos.totalPages > 1}" class="flex items-center justify-center gap-3 mt-6">
        <a th:if="${eventos.hasPrevious()}"
           th:href="@{/admin/eventos(page=${eventos.number - 1})}"
           class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-100 transition-all duration-300">
            ← Anterior
        </a>
        <span class="px-4 py-2 text-sm text-slate-500">
            Página <span th:text="${eventos.number + 1}"></span> de <span th:text="${eventos.totalPages}"></span>
        </span>
        <a th:if="${eventos.hasNext()}"
           th:href="@{/admin/eventos(page=${eventos.number + 1})}"
           class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-100 transition-all duration-300">
            Siguiente →
        </a>
    </div>
</section>

</body>
</html>
