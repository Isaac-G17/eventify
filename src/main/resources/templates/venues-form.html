<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Al servirse, Thymeleaf reemplaza este bloque por el fragmento; abierto como archivo, el navegador usa este contenido -->
    <th:block th:replace="~{fragments/layout :: recursos}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13"></script>
    </th:block>
    <title>Formulario de Lugar</title>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center px-6">

<div class="bg-white rounded-2xl shadow-md w-full max-w-md p-8">
    <h1 class="text-xl font-semibold mb-6"
        th:text="${venue.id == null} ? 'Registrar nuevo lugar' : 'Editar lugar'">
        Registrar nuevo lugar
    </h1>

    <form th:action="${venue.id == null} ? @{/admin/venues} : @{/admin/venues/{id}(id=${venue.id})}"
          th:object="${venue}" method="post" class="space-y-4" novalidate>

        <!-- En edición el id viaja oculto: el grupo OnUpdate lo exige -->
        <input type="hidden" th:if="*{id != null}" th:field="*{id}"/>

        <div th:replace="~{fragments/layout :: erroresGlobales}"></div>

        <div>
            <label for="nombre" class="block text-sm font-medium text-slate-600 mb-1">Nombre</label>
            <input type="text" th:field="*{nombre}" th:errorclass="campo-invalido"
                   class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-950 transition-all duration-300" />
            <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-campo">Error</p>
        </div>

        <div>
            <label for="direccion" class="block text-sm font-medium text-slate-600 mb-1">Dirección</label>
            <input type="text" th:field="*{direccion}" th:errorclass="campo-invalido"
                   class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-950 transition-all duration-300" />
            <p th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}" class="error-campo">Error</p>
        </div>

        <div>
            <label for="ciudad" class="block text-sm font-medium text-slate-600 mb-1">Ciudad</label>
            <input type="text" th:field="*{ciudad}" th:errorclass="campo-invalido"
                   class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-950 transition-all duration-300" />
            <p th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}" class="error-campo">Error</p>
        </div>

        <div>
            <label for="capacidad" class="block text-sm font-medium text-slate-600 mb-1">Capacidad</label>
            <input type="number" th:field="*{capacidad}" th:errorclass="campo-invalido"
                   class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-950 transition-all duration-300" />
            <p th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}" class="error-campo">Error</p>
        </div>

        <div class="flex justify-end gap-3 pt-2">
            <a th:href="@{/admin/venues}"
               class="px-5 py-2.5 rounded-2xl bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition-all duration-300">
                Cancelar
            </a>
            <button type="submit"
                    class="px-5 py-2.5 rounded-2xl bg-blue-950 text-white font-medium shadow-sm hover:bg-blue-900 transition-all duration-300">
                Guardar
            </button>
        </div>
    </form>
</div>

</body>
</html>
