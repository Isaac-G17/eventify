<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Al servirse, Thymeleaf reemplaza este bloque por el fragmento; abierto como archivo, el navegador usa este contenido -->
    <th:block th:replace="~{fragments/layout :: recursos}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13"></script>
    </th:block>
    <title>Panel Administrativo - Venues</title>
</head>
<body class="bg-slate-50 text-slate-900">

<header th:replace="~{fragments/layout :: encabezado('Panel de Lugares', 'Administra el catálogo de lugares.', 'venues')}"></header>

<section class="max-w-6xl mx-auto px-6 py-12">
    <div th:replace="~{fragments/layout :: alerta}"></div>

    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-semibold">Lugares registrados</h2>
        <a th:href="@{/admin/venues/nuevo}"
           class="px-5 py-2.5 rounded-2xl bg-blue-950 text-white font-medium shadow-sm hover:bg-blue-900 transition-all duration-300">
            + Registrar nuevo lugar
        </a>
    </div>

    <div th:if="${venues.isEmpty()}" class="text-slate-500">
        Actualmente no hay lugares registrados.
    </div>

    <div th:unless="${venues.isEmpty()}" class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-blue-950 text-blue-100 text-sm uppercase tracking-wide">
            <tr>
                <th class="px-6 py-3">ID</th>
                <th class="px-6 py-3">Nombre</th>
                <th class="px-6 py-3">Dirección</th>
                <th class="px-6 py-3">Ciudad</th>
                <th class="px-6 py-3">Capacidad</th>
                <th class="px-6 py-3">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="venue : ${venues}"
                class="border-t border-slate-100 hover:bg-blue-50 transition-all duration-300">
                <td class="px-6 py-4 text-slate-400" th:text="${venue.id}"></td>
                <td class="px-6 py-4 font-medium" th:text="${venue.nombre}"></td>
                <td class="px-6 py-4 text-slate-500" th:text="${venue.direccion}"></td>
                <td class="px-6 py-4 text-slate-500" th:text="${venue.ciudad}"></td>
                <td class="px-6 py-4 text-slate-500" th:text="${venue.capacidad}"></td>
                <td class="px-6 py-4">
                    <div class="flex gap-2">
                        <a th:href="@{/admin/venues/{id}/editar(id=${venue.id})}"
                           class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-medium hover:bg-slate-200 transition-all duration-300">
                            Editar
                        </a>
                        <form th:action="@{/admin/venues/{id}/eliminar(id=${venue.id})}" method="post"
                              onsubmit="return confirm('¿Seguro que deseas eliminar este lugar?')">
                            <button type="submit"
                                    class="px-3 py-1.5 rounded-xl bg-red-50 text-red-600 text-sm font-medium hover:bg-red-100 transition-all duration-300">
                                Eliminar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${venues.totalPages > 1}" class="flex items-center justify-center gap-3 mt-6">
        <a th:if="${venues.hasPrevious()}"
           th:href="@{/admin/venues(page=${venues.number - 1})}"
           class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-100 transition-all duration-300">
            ← Anterior
        </a>
        <span class="px-4 py-2 text-sm text-slate-500">
            Página <span th:text="${venues.number + 1}"></span> de <span th:text="${venues.totalPages}"></span>
        </span>
        <a th:if="${venues.hasNext()}"
           th:href="@{/admin/venues(page=${venues.number + 1})}"
           class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-100 transition-all duration-300">
            Siguiente →
        </a>
    </div>
</section>

</body>
</html>
